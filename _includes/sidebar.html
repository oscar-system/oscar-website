<input type="checkbox" id="menu-toggle" class="menu-checkbox">
<label for="menu-toggle" class="menu-icon" aria-label="Toggle navigation">
  <!-- hamburger icon -->
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(0, 0, 0, 0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</label>
<div class="sidebar">
  <div class="container">
    <div class="sidebar-about">
      <a href="{{ site.baseurl }}/">
        <img class="sidebar-image" src="{{ site.baseurl }}/public/OSCAR-Logo.svg" alt="OSCAR Symbolic Tools" />
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-nav-item {% if page.url == '/' %}active{% endif %}">
        <a href="{{site.baseurl}}/" class="sidebar-nav-link">
          Home
        </a>
    </div>
      {% for item in site.data.sidebar %}
        {% if item.spacer %}
          <div style="margin-top: 0.7em;"></div>
        {% elsif item.submenu %}
        <div class="sidebar-nav-item {% if page.url contains item.url %}active{% endif %}">
          <details {% if page.url contains item.url %}open{% endif %}>
            <summary class="nav">
              <a href="{{ site.baseurl}}{{ item.url }}" class="sidebar-nav-link">
                {{ item.title }}
              </a>
            </summary>

            <ul class="submenu">
              {% for subitem in item.submenu %}
                <li class="{% if page.url contains subitem.url %}active{% endif %}">
                  <a href="{% if subitem.url contains 'http' %}{{ subitem.url }}{% else %}{{ site.baseurl }}{{ subitem.url }}{% endif %}" {% if subitem.url contains 'http' %}target="_blank" rel="noopener noreferrer"{% endif %}>
                    {{ subitem.title }}
                  </a>
                </li>
              {% endfor %}
            </ul>
          </details>
        </div>
          {% else %}
          <div class="sidebar-nav-item {% if page.url contains item.url %}active{% endif %}">
          <a href="{{ site.baseurl}}{{ item.url }}" class="sidebar-nav-link">
            {{ item.title }}
          </a>
        </div>
          {% endif %}
      {% endfor %}
    </nav>

    <div class="mobile-hidden">
      <hr>
      {% include footer.html %}
    </div>
  </div>
</div>
