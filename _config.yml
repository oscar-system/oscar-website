# Dependencies
markdown:         kramdown
highlighter:      rouge

# Permalinks
permalink:        pretty

# Setup
title:            'OSCAR Computer Algebra System'
description:      'OSCAR, an Open Source Computer Algebra Research System written in Julia'
url:              https://oscar.github.io
baseurl:          /oscar-website

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# for SEO plugin
tagline:          'OSCAR Computer Algebra System'
logo:             /public/OSCAR-Logo.svg

exclude:
  - _config_production.yml
  - etc
  - LICENSE.hyde.md
  - README.hyde.md
  - README.md

number_of_displayed_events_on_index_page: 4
full_date_format: "%d %b %Y"
month_date_format: "%b %Y"
