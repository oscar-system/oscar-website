name: OSCAR Release Watcher

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Update latest release file
        id: release
        env:
          API_KEY: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: oscar-system/Oscar.jl
          JULIA_MIN: "1.10"
        run: |
          python3 etc/update-latest-release.py

      - name: Open release checklist issue
        if: steps.release.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED_UTC: ${{ steps.release.outputs.published_utc }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const published = process.env.PUBLISHED_UTC;

            const title = `OSCAR v${version} release requires follow-up`;

            const body = [
              `# OSCAR v${version} release requires follow-up`,
              '',
              `A new OSCAR release **v${version}** was published on **${published}** (UTC).`,
              '',
              'Please send an email to the OSCAR mailing list (<oscar-dev@mathematik.uni-kl.de>) to inform about this update.',
              'You can use the following template:',
              '',
              '```text',
              `Subject: [OSCAR] New OSCAR release v${version}`,
              '',
              'Dear all,',
              '',
              `We are happy to announce that OSCAR version v${version} has been released`,
              `on ${published} (UTC).`,
              '',
              'Highlights of this release:',
              '- (Add 2-3 bullet points summarizing major changes or improvements)',
              '',
              'The new version is available from GitHub and via the usual installation',
              'methods. Full release notes can be found here:',
              `https://github.com/oscar-system/Oscar.jl/releases/tag/v${version}`,
              '',
              'Best regards,',
              'The OSCAR Team',
              '```',
              '',
              'CC: @HereAround',
              '',
              '_Opened automatically by a scheduled workflow._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['release-process'],
            });

      - name: Create PR updating latest release
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update latest OSCAR release to v${{ steps.release.outputs.version }}"
          title: "Update latest OSCAR release to v${{ steps.release.outputs.version }}"
          body: |
            This PR updates `_data/release.yml` to the latest OSCAR release `v${{ steps.release.outputs.version }}`.

            _Opened automatically by a scheduled workflow._
          branch: "bot/update-latest-release-v${{ steps.release.outputs.version }}"
          labels: "release-process"
          author: "update_release[bot] <update_release[bot]@users.noreply.github.com>"
          committer: "update_release[bot] <update_release[bot]@users.noreply.github.com>"
