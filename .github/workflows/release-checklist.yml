name: OSCAR Release Watcher

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etc/requirements.txt
      
      - name: Detect new OSCAR release
        id: release
        env:
          API_KEY: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: oscar-system/Oscar.jl
        run: |
          python3 etc/update-latest-release.py

      - name: Validate _data/release.yml structure
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -e '
              has("version")    and (.version    | type == "!!str" and length > 0) and
              has("year")       and (.year       | type == "!!str" and length > 0) and
              has("month")      and (.month      | type == "!!str" and length > 0) and
              has("day")        and (.day        | type == "!!str" and length > 0) and
              has("date")       and (.date       | type == "!!str" and length > 0) and
              has("julia-min")  and (."julia-min"| type == "!!str" and length > 0)
            ' _data/release.yml

      - name: Create issue with release checklist
        if: steps.release.outputs.changed == 'true'
        uses: JasonEtco/create-an-issue@v2
        # marketplace action : https://github.com/marketplace/actions/create-an-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED_UTC: ${{ steps.release.outputs.published_utc }}
        with:
          filename: .github/release-checklist-template.md
          assignees: HereAround, aaruni96
          update_existing: true
          search_existing: open          

      - name: Create pull request which updates _data/release.yml
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update latest OSCAR release to v${{ steps.release.outputs.version }}"
          title: "Update latest OSCAR release to v${{ steps.release.outputs.version }}"
          body: |
            This PR updates `_data/release.yml` to the latest OSCAR release `v${{ steps.release.outputs.version }}`.

            _Opened automatically by a scheduled workflow._
          branch: "bot/update-latest-release-v${{ steps.release.outputs.version }}"
          base: gh-pages
          labels: "release-process"
          author: "update_release[bot] <update_release[bot]@users.noreply.github.com>"
          committer: "update_release[bot] <update_release[bot]@users.noreply.github.com>"
