name: Contributors Update Script

on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-contributors-update-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install PyGithub pyyaml requests

    - name: Run update-contributors script
      env:
        API_KEY: ${{secrets.API_KEY}}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONUNBUFFERED: "1"
      run: |
        cd etc
        python3 update-contributors.py
        cd ..

    - name: Show summary.txt
      run: |
        echo "::group::summary.txt"
        sed -n '1,200p' summary.txt || echo "summary.txt not found"
        echo "::endgroup::"

    - name: Compute date
      if: github.event_name != 'pull_request' && !cancelled()
      run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Create Pull Request
      if: github.event_name != 'pull_request' && !cancelled()
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: "Update contributors on ${{ env.TODAY }}"
        branch: update-contributors
        delete-branch: true
        title: "Update contributors"
        body-path: summary.txt
        base: gh-pages
        author: "update_contributors[bot] <update_contributors[bot]@users.noreply.github.com>"
        committer: "update_contributors[bot] <update_contributors[bot]@users.noreply.github.com>"
