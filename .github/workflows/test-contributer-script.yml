name: Contributors Update Script

on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-contributors-update-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r etc/requirements.txt

    - name: Record current number of contributors (listed in people_list.yml)
      uses: mikefarah/yq@v4
      with:
        cmd: |
          test -f _data/people_list.yml
          yq -e 'type == "!!seq"' _data/people_list.yml >/dev/null
          echo "PEOPLE_COUNT_BEFORE=$(yq -r 'length' _data/people_list.yml)" >> $GITHUB_ENV

    - name: Run update-contributors script
      env:
        API_KEY: ${{secrets.API_KEY}}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONUNBUFFERED: "1"
      run: |
        cd etc
        python3 update-contributors.py
        cd ..

    - name: Ensure summary.txt exists
      run: |
        if [ ! -s summary.txt ]; then
          echo "ERROR: summary.txt was not created (or is empty). Failing."
          ls -la
          exit 1
        fi

    - name: Show summary.txt
      run: |
        echo "::group::summary.txt"
        cat summary.txt
        echo "::endgroup::"

    - name: Validate overall structure of _data/people_list.yml
      uses: mikefarah/yq@v4
      with:
        cmd: |
          yq -e '
            type == "!!seq" and length > 0
            and
            (
              map(
                select(
                  (type != "!!map")
                  or (has("name")   | not) or (.name   | type != "!!str" or length == 0)
                  or (has("status") | not) or (.status | type != "!!str" or length == 0)
                  or (has("github") | not) or (.github | type != "!!str" or length == 0)
                )
              )
              | length == 0
            )
          ' _data/people_list.yml

    - name: Validate GitHub handles of contributors (in _data/people_list.yml) are unique
      uses: mikefarah/yq@v4
      with:
        cmd: |
          yq -e '
            (map(.github) | length) == (map(.github) | unique | length)
          ' _data/people_list.yml

    - name: Ensure that the number of contributors (in _data/people_list.yml) did not shrink
      uses: mikefarah/yq@v4
      with:
        cmd: |
          PEOPLE_COUNT_AFTER=$(yq -r 'length' _data/people_list.yml)
          echo "Counts:"
          echo "_data/people_list.yml entries: before=${PEOPLE_COUNT_BEFORE} after=${PEOPLE_COUNT_AFTER}"
          test "$PEOPLE_COUNT_AFTER" -ge "${{ env.PEOPLE_COUNT_BEFORE }}"

    - name: Compute date
      if: github.event_name != 'pull_request' && !cancelled()
      run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Create Pull Request
      if: github.event_name != 'pull_request' && !cancelled()
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: "Update contributors on ${{ env.TODAY }}"
        branch: update-contributors
        delete-branch: true
        title: "Update contributors"
        body-path: summary.txt
        base: gh-pages
        author: "update_contributors[bot] <update_contributors[bot]@users.noreply.github.com>"
        committer: "update_contributors[bot] <update_contributors[bot]@users.noreply.github.com>"
