name: Build Website with Jeykll

on:
  workflow_dispatch: {}
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby (Bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Jekyll build (server config)
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --trace \
            --strict_front_matter \
            --config _config.yml,_config_production.yml \
            -d _site
