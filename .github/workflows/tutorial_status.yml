name: Update Tutorial Status

on:
  pull_request:
  push:
    branches: [gh-pages]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tutorial-status-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etc/requirements.txt

      - name: Update Tutorial Status
        env:
          API_KEY: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 etc/update_tutorial_status.py

      - name: Ensure _data/examples_status.yml exists
        run: |
          test -s _data/examples_status.yml

      - name: Show _data/examples_status.yml
        if: always()
        run: |
          echo "::group::_data/examples_status.yml"
          cat _data/examples_status.yml
          echo "::endgroup::"

      - name: Validate _data/examples_status.yml schema (yq)
        uses: mikefarah/yq@v4
        with:
          cmd: |
            test -s _data/examples_status.yml
            yq -e '
              type == "!!map" and length > 0 and
              (to_entries
               | map(.value == "success" or .value == "fail" or .value == "cancelled")
               | all)
            ' _data/examples_status.yml
