name: Update Contributors

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contributors:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install PyGithub pyyaml requests

    - name: Run update-contributors script
      env:
        API_KEY: ${{secrets.API_KEY}}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONUNBUFFERED: "1"
      run: |
        cd etc
        python3 update-contributors.py
        cd ..

    - name: Show summary.txt
      run: |
        echo "::group::summary.txt"
        sed -n '1,200p' summary.txt || echo "summary.txt not found"
        echo "::endgroup::"

    - name: Create Pull Request
      if: github.event_name != 'pull_request' && !cancelled()
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "Update contributors on ${{ github.run_started_at[0:10] }}"
        branch: update-contributors
        delete-branch: true
        title: "Update contributors"
        body-path: summary.txt
        base: gh-pages
